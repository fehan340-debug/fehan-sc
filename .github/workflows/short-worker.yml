name: Short Scraper Background Worker

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual-admin
      requested_at:
        description: Trigger timestamp
        required: false
        default: ""

concurrency:
  group: nasdaq-short-worker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_TABLE: scanner_worker_store
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install short-worker dependency only
        run: |
          cp package.json /tmp/package.full.json
          printf '%s\n' '{"name":"short-worker-ci","private":true,"type":"module","dependencies":{"cheerio":"1.1.2"}}' > package.json
          npm install --no-audit --no-fund --ignore-scripts --package-lock=false
          mv /tmp/package.full.json package.json

      - name: Validate required secrets
        run: |
          test -n "$SCRAPINGANT_API_KEY" || (echo "Missing SCRAPINGANT_API_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing SUPABASE_KEY" && exit 1)
          echo "Supabase and ScrapingAnt secrets are present."

      - name: Run external short scraper
        env:
          FORCE_SHORT_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          FORCE_SHORT_PUBLISH: ${{ startsWith(github.event.inputs.source, 'manual-') && 'true' || 'false' }}
        run: node worker/short-worker.mjs

      - name: Refresh Ertikaz short condition
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: scanner_worker_store
          SUPABASE_SITE_SETTINGS_TABLE: app_site_settings_store
        run: |
          node --input-type=module <<'NODE'
          import { refreshErtikazShortFromCache } from './netlify/functions/ertikaz-core.mjs';
          const r = await refreshErtikazShortFromCache();
          console.log(JSON.stringify(r, null, 2));
          if (!r?.ok) process.exit(1);
          NODE
