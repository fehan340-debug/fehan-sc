name: Short Scraper Background Worker

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual-admin
      requested_at:
        description: Trigger timestamp
        required: false
        default: ""

concurrency:
  group: nasdaq-short-worker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_TABLE: scanner_worker_store
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and ensure lock file
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo 'package-lock.json not found; generating it with npm install.'
            npm install --no-audit --no-fund
          fi

      - name: Enable npm cache
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate required secrets
        run: |
          test -n "$SCRAPERAPI_KEY" || (echo "Missing SCRAPERAPI_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing SUPABASE_KEY" && exit 1)
          echo "Supabase and ScraperAPI secrets are present."

      - name: Run external short scraper
        env:
          FORCE_SHORT_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node worker/short-worker.mjs
