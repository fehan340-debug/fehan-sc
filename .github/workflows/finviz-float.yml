name: Scrape Free Float Data

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: daily-market-open
      requested_at:
        description: Trigger timestamp
        required: false
        default: ""
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: nasdaq-daily-float-worker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_TABLE: scanner_worker_store
      FORCE_FLOAT_RUN: ${{ github.event.inputs.source == 'manual-admin-float-only' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required secrets
        run: |
          test -n "$SCRAPINGANT_API_KEY" || (echo "Missing SCRAPINGANT_API_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing SUPABASE_KEY" && exit 1)
          echo "Free Float and Supabase secrets are present."

      - name: Run daily Finviz float worker
        run: node worker/float-worker.mjs
