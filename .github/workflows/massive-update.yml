name: Massive Market Data Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: scheduled
      requested_at:
        description: Trigger timestamp
        required: false
        default: ""

concurrency:
  group: massive-five-minute-pipeline
  cancel-in-progress: false

jobs:
  update-massive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_TABLE: scanner_worker_store
      SUPABASE_SITE_SETTINGS_TABLE: app_site_settings_store
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required secrets
        run: |
          test -n "$MASSIVE_API_KEY" || (echo "Missing MASSIVE_API_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing SUPABASE_KEY" && exit 1)
          echo "Massive and Supabase secrets are present."

      - name: Run node worker/massive-worker.mjs
        env:
          FORCE_MASSIVE_RUN: ${{ github.event.inputs.source == 'manual-admin-massive' && 'true' || 'false' }}
        run: node worker/massive-worker.mjs
