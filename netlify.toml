[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Automation lanes:
# - Massive live/extended prices: every 5 minutes on weekdays; daily technical indicators rebuild once at 16:00 ET.
# - Short/borrow: starts at minute 30 and publishes at the next top of the hour.
# - Stock Splits (rolling 100 days) + Finviz Free Float: once daily at 09:30 America/New_York.
# - IPO snapshot: once daily.
# GitHub Actions owns the Massive five-minute technical/live-price pipeline.
# Netlify cron is used only for the independent daily/alert lanes.
# Customer scanner responses are protected by no-store server responses.
