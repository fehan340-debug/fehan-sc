[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Automation lanes:
# - Massive technical + live prices: every 10 minutes on weekdays.
# - Short/borrow: starts at minute 30 and publishes at the next top of the hour.
# - Stock Splits (rolling 100 days) + Finviz Free Float: once daily at 09:30 America/New_York.
# - IPO snapshot: once daily.
# Netlify cron invokes the relevant checks; each function validates America/New_York time so DST is handled correctly.
# Customer scanner responses are protected by a 5-minute server/edge cache layer.
